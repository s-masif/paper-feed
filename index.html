<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>paper feed | S M Asiful Huda</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --theme: #b509ac;          /* al-folio's default accent: change this to match your site */
    --text: #000000;
    --muted: #6c757d;
    --divider: rgba(0, 0, 0, .1);
    --bg: #ffffff;
    --preprint: #7a7f87;       /* badge color for arXiv preprints */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 4rem; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 1rem/1.5 Roboto, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: var(--theme); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--theme); outline-offset: 2px; }

  /* top bar, like al-folio's navbar */
  nav {
    position: sticky; top: 0; z-index: 10; background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid var(--divider); padding-top: env(safe-area-inset-top, 0px);
  }
  nav .inner {
    max-width: 930px; margin: 0 auto; padding: .7rem 1rem;
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  }
  nav .name { color: var(--text); font-weight: 300; font-size: 1.15rem; }
  nav .name b { font-weight: 700; }
  nav .links { display: flex; align-items: center; gap: 1.1rem; font-size: .95rem; }
  nav .links a { color: var(--text); }
  nav .links a.current { color: var(--theme); }
  nav .links a:hover { color: var(--theme); text-decoration: none; }
  .kbd {
    font: 400 .8rem Roboto, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--muted);
    background: transparent; border: 1px solid var(--divider); border-radius: .25rem;
    padding: .1rem .45rem; cursor: pointer;
  }
  .kbd:hover { color: var(--theme); border-color: var(--theme); }
  .menu-toggle { display: none; background: none; border: 0; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--text); padding: .2rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  main { max-width: 930px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  h1 { font-weight: 300; font-size: 2.5rem; line-height: 1.2; margin: 0 0 .25rem; }
  .description { color: var(--muted); margin: 0 0 .25rem; }
  .updated { color: var(--muted); font-size: .85rem; margin: 0 0 1.5rem; }

  .search {
    width: 100%; font: 400 1rem Roboto, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--text);
    background: var(--bg); border: 1px solid var(--divider); border-radius: .25rem;
    padding: .5rem .75rem; margin-bottom: .9rem;
  }
  .search:focus { outline: none; border-color: var(--theme); box-shadow: 0 0 0 .15rem rgba(181, 9, 172, .15); }
  .filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filters button {
    font: 400 .8rem Roboto, -apple-system, "Segoe UI", Arial, sans-serif; text-transform: uppercase;
    letter-spacing: .02em; color: var(--text); background: transparent;
    border: 1px solid var(--text); border-radius: .2rem; padding: .3rem .8rem; cursor: pointer;
  }
  .filters button:hover { border-color: var(--theme); color: var(--theme); }
  .filters button[aria-pressed="true"] { background: var(--theme); border-color: var(--theme); color: #fff; }

  /* date headers, like al-folio's year headers */
  h2 {
    font-weight: 300; font-size: 1.6rem; color: rgba(0, 0, 0, .25); text-align: right;
    border-top: 1px solid var(--divider); margin: 2rem 0 .5rem; padding-top: .5rem;
  }

  ol { list-style: none; padding: 0; margin: 0; }
  li.paper { display: grid; grid-template-columns: 7rem 1fr; gap: 1rem; padding: .9rem 0; }
  .abbr { padding-top: .2rem; }
  .badge {
    display: inline-block; max-width: 100%; background: var(--theme); color: #fff;
    font-size: .75rem; font-weight: 700; line-height: 1.25; text-align: center;
    padding: .3rem .4rem; border-radius: .25rem; width: 6.25rem; overflow-wrap: anywhere;
  }
  .badge.preprint { background: var(--preprint); }
  .title { font-weight: 700; margin: 0; }
  .title a { color: var(--text); }
  .title a:hover { color: var(--theme); text-decoration: none; }
  .author { margin: .1rem 0 0; }
  .periodical { margin: .1rem 0 0; font-style: italic; }
  .graph-tag { font-style: normal; font-size: .75rem; color: var(--theme); margin-left: .4rem; }
  .preview {
    margin: .45rem 0 0; color: #333; font-size: .92rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  li.open .preview { display: none; }
  .abstract {
    display: none; margin: .6rem 0 0; padding: .6rem .8rem; font-size: .92rem;
    border: 1px solid var(--divider); border-radius: .25rem;
  }
  li.open .abstract { display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .55rem; }
  .btn {
    font: 400 .72rem Roboto, -apple-system, "Segoe UI", Arial, sans-serif; text-transform: uppercase;
    color: var(--text); background: transparent; border: 1px solid var(--text);
    border-radius: .2rem; padding: .15rem .7rem; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { color: var(--theme); border-color: var(--theme); text-decoration: none; }
  li.open .btn.abs { color: var(--theme); border-color: var(--theme); }
  .status { color: var(--muted); }

  footer {
    max-width: 930px; margin: 0 auto; padding: 1.5rem 1rem 2rem; text-align: center;
    color: var(--muted); font-size: .8rem; border-top: 1px solid var(--divider);
  }

  @media (max-width: 576px) {
    h1 { font-size: 2rem; }
    li.paper { grid-template-columns: 1fr; gap: .4rem; }
    .badge { width: auto; }
    .menu-toggle { display: block; }
    nav .inner { flex-wrap: wrap; }
    nav .links { display: none; width: 100%; flex-direction: column; align-items: flex-end; gap: .6rem; padding: .4rem 0 .3rem; }
    nav.open .links { display: flex; }
  }
</style>
</head>
<body>
<nav>
  <div class="inner">
    <a class="name" href="https://s-masif.github.io/"><b>S M Asiful</b> Huda</a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div class="links">
      <a href="https://s-masif.github.io/">about</a>
      <a href="https://s-masif.github.io/publications/">publications</a>
      <a href="https://s-masif.github.io/cv/">CV</a>
      <a href="https://s-masif.github.io/gallery/">gallery</a>
      <a href="./" class="current" aria-current="page">paper feed<span class="sr-only"> (current)</span></a>
      <button class="kbd" type="button" id="kbd" title="Search papers">ctrl k</button>
    </div>
  </div>
</nav>
<main>
  <h1>paper feed</h1>
  <p class="description">new papers on federated learning and graph neural networks, updated daily.</p>
  <p class="updated" id="updated">Loading papers…</p>
  <input class="search" id="search" type="search" placeholder="Type to filter" aria-label="Filter papers by title, author, venue or abstract">
  <div class="filters" role="group" aria-label="Topic">
    <button data-topic="fl" aria-pressed="false">Federated learning</button>
    <button data-topic="fl-gnn" aria-pressed="true">Federated graph learning</button>
    <button data-topic="nature-ai" aria-pressed="false">Nature · AI</button>
    <button data-topic="conf" aria-pressed="false">Top conferences</button>
  </div>
  <div id="feed"></div>
</main>
<footer>Papers from arXiv, OpenAlex and OpenReview. Venues limited to selected journals and conferences.</footer>
<script>
const feed = document.getElementById("feed");
const search = document.getElementById("search");
let papers = [];
let topic = "fl-gnn";

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// Links come from outside sources: only allow http(s) URLs.
function safe(url) {
  return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null;
}

function dayLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}

// Short venue label for the badge, like the abbreviations on al-folio publication lists.
const VENUE_ABBR = [
  [/neural information processing systems|\bneurips\b/i, "NeurIPS"],
  [/international conference on machine learning|\bicml\b/i, "ICML"],
  [/international conference on learning representations|\biclr\b/i, "ICLR"],
  [/sigkdd|\bkdd\b/i, "KDD"],
  [/aaai/i, "AAAI"],
  [/international joint conference on artificial intelligence|\bijcai\b/i, "IJCAI"],
  [/\bweb conference\b|world wide web conference/i, "WWW"],
  [/computer vision and pattern recognition/i, "CVPR"],
  [/international conference on computer vision/i, "ICCV"],
  [/\binfocom\b/i, "INFOCOM"],
  [/international conference on data engineering/i, "ICDE"],
  [/\bvldb\b|very large data bases/i, "VLDB"],
  [/\bsigmod\b/i, "SIGMOD"],
  [/web search and data mining/i, "WSDM"],
  [/information and knowledge management/i, "CIKM"],
  [/international conference on data mining/i, "ICDM"],
  [/\bmobicom\b/i, "MobiCom"],
];
function badgeText(venue) {
  if (!venue) return "arXiv";
  for (const [re, abbr] of VENUE_ABBR) if (re.test(venue)) return abbr;
  // "IEEE Transactions on Neural Networks and Learning Systems" -> "IEEE TNNLS"
  const t = venue.match(/ieee transactions on (.+)/i);
  if (t) {
    const initials = t[1].split(/[\s,-]+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).join("");
    return "IEEE T" + initials;
  }
  return venue;  // e.g. "Nature Communications"
}

function render() {
  feed.replaceChildren();
  const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = papers.filter(p => p.tags.includes(topic) &&
    words.every(w => [p.title, p.authors.join(" "), p.venue || "arxiv preprint", p.abstract].join(" ").toLowerCase().includes(w)));
  if (!shown.length) {
    feed.append(el("p", { className: "status", textContent: words.length
      ? "No papers match your search in this topic."
      : "No papers in this topic yet. The next daily update will add any new ones." }));
    return;
  }
  // The conference tab is grouped by conference and year ("NeurIPS 2025"), the others by date.
  const byConf = topic === "conf";
  if (byConf) {
    const order = ["NeurIPS", "ICML", "ICLR", "AAAI", "IJCAI"];
    shown.sort((a, b) => b.conf.split(" ")[1] - a.conf.split(" ")[1] ||
      order.indexOf(a.conf.split(" ")[0]) - order.indexOf(b.conf.split(" ")[0]) || a.title.localeCompare(b.title));
  }
  let lastGroup = null, list = null;
  for (const p of shown) {
    const group = byConf ? p.conf : p.published;
    if (group !== lastGroup) {
      lastGroup = group;
      list = el("ol");
      feed.append(el("h2", { textContent: byConf ? p.conf : dayLabel(p.published) }), list);
    }
    const authors = p.authors.length > 6 ? p.authors.slice(0, 6).join(", ") + ", et al." : p.authors.join(", ");
    const li = el("li", { className: "paper" });
    const badge = el("span", { className: "badge" + (p.venue ? "" : " preprint"), textContent: badgeText(p.venue) });
    if (p.venue) badge.title = p.venue;

    const periodical = el("p", { className: "periodical", textContent: p.venue || "arXiv preprint" });
    const isGraph = p.tags.includes("fl-gnn") || (byConf && /graph|gnn/i.test(p.title));
    if ((topic === "fl" || byConf) && isGraph) periodical.append(el("span", { className: "graph-tag", textContent: "· graph" }));

    const actions = el("div", { className: "actions" });
    if (p.abstract) {
      const abs = el("button", { className: "btn abs", textContent: "Abs", type: "button" });
      abs.setAttribute("aria-expanded", "false");
      abs.onclick = () => abs.setAttribute("aria-expanded", String(li.classList.toggle("open")));
      actions.append(abs);
    }
    for (const label of ["arXiv", "OpenReview", "Publisher", "PDF"]) {
      if (safe(p.links[label])) actions.append(el("a", { className: "btn", href: p.links[label], target: "_blank", rel: "noopener", textContent: label }));
    }

    const main = safe(p.links.Publisher) || safe(p.links.OpenReview) || safe(p.links.arXiv) || safe(p.links.PDF);
    const body = el("div", {},
      el("p", { className: "title" }, main ? el("a", { href: main, target: "_blank", rel: "noopener", textContent: p.title }) : p.title),
      el("p", { className: "author", textContent: authors }),
      periodical,
      el("p", { className: "preview", textContent: p.abstract || "No abstract available here. Open the paper to read it." })
    );
    if (p.abstract) body.append(el("p", { className: "abstract", textContent: p.abstract }));
    body.append(actions);
    li.append(el("div", { className: "abbr" }, badge), body);
    list.append(li);
  }
}

document.querySelectorAll(".filters button").forEach(btn => {
  btn.onclick = () => {
    topic = btn.dataset.topic;
    document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  };
});

search.addEventListener("input", render);

// "ctrl k" (or Cmd+K on Mac) jumps to the search box.
function focusSearch() {
  nav.classList.remove("open");
  search.focus();
  search.scrollIntoView({ block: "center" });
}
document.getElementById("kbd").onclick = focusSearch;
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); focusSearch(); }
});

// Menu toggle on small screens.
const nav = document.querySelector("nav");
const toggle = document.querySelector(".menu-toggle");
toggle.onclick = () => toggle.setAttribute("aria-expanded", String(nav.classList.toggle("open")));

fetch("papers.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    papers = data.papers;
    const when = new Date(data.updated).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    document.getElementById("updated").textContent = `${papers.length} papers. Updated ${when}.`;
    render();
  })
  .catch(() => {
    document.getElementById("updated").textContent =
      "No papers.json yet. Run the “Update paper feed” workflow once from the Actions tab on GitHub.";
  });
</script>
</body>
</html>
