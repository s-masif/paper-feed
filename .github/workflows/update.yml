name: Update paper feed

on:
  schedule:
    - cron: "17 6 * * *"    # every day at 06:17 UTC
    - cron: "17 18 * * *"   # and 18:17 UTC, as a backup
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
      - name: Commit new papers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add papers.json feed index.html
          git diff --staged --quiet || (git commit -m "Update papers" && git push)
